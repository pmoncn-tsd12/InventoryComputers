<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Equipment Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b6b6b;--line:#d9d9d9;--card:#f6f6f6;--inv:#111;--invfg:#fff}
[data-theme=dark]{--bg:#0c0c0c;--fg:#eee;--mut:#9a9a9a;--line:#2e2e2e;--card:#161616;--inv:#eee;--invfg:#0c0c0c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 'Open Sans',Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:24px}
button{font:inherit;cursor:pointer;border:1px solid var(--fg);background:transparent;color:var(--fg);padding:7px 14px;border-radius:2px}
button:hover{background:var(--card)}button.p{background:var(--inv);color:var(--invfg)}button.p:hover{opacity:.85}
button.s{padding:3px 9px;font-size:12px}
input,textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:2px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.bar{display:flex;gap:12px;margin-bottom:16px}.bar input{max-width:340px}
table.l{width:100%;border-collapse:collapse}
table.l th,table.l td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
table.l th{font-size:12px;color:var(--mut);font-weight:600}
td.a{white-space:nowrap;text-align:right}td.a button{margin-left:4px}
.empty{padding:48px 0;text-align:center;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
fieldset{border:1px solid var(--line);margin:0 0 16px;padding:12px 14px}legend{font-weight:600;padding:0 6px}
.eq{width:100%;border-collapse:collapse}.eq td,.eq th{padding:3px}.eq th{font-size:12px;color:var(--mut);text-align:left}
.eq td:first-child{width:90px;font-weight:600;font-size:12px}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.row label{display:inline;color:var(--fg);font-size:14px}
.row input[type=checkbox],.row input[type=radio]{width:auto;margin-right:5px}
.acts{display:flex;gap:8px;justify-content:flex-end}
#msg{color:var(--mut);font-size:12px;margin-left:8px}
#view{position:fixed;inset:0;background:rgba(0,0,0,.65);overflow:auto;padding:20px;display:none;z-index:9}
.tb{position:sticky;top:0;display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.tb button{background:#fff;color:#111;border-color:#111}.tb button.p{background:#111;color:#fff;border-color:#fff}
/* ---- printable form ---- */
#sheet{width:740px;margin:0 auto;background:#fff;color:#000;padding:16px 4px;font:12px/1.3 'Open Sans',Arial,sans-serif}
#sheet *{color:#000}
#sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
#sheet .ttl{text-align:center;font-weight:700;font-size:13px;padding:4px 0 0 40px;flex:1}
#sheet .logos{display:flex;gap:12px;align-items:center}#sheet .logos img{height:56px}
#sheet .sub{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 8px}
#sheet .sub .l{text-align:center;font-weight:700;font-size:13px;width:60%}
#sheet .sub .l small{display:block;font-size:11px;margin-top:4px}
#sheet .sub .r{text-align:right;font-weight:600;font-size:11.5px;line-height:1.9}
#sheet u{display:inline-block;min-width:60px;text-align:center;text-decoration:none;border-bottom:1px solid #000;font-weight:600}
.bx{border:1px solid #000;padding:6px 12px}
.ln{display:flex;align-items:flex-end;gap:6px;margin:5px 0;font-weight:700}
.ln span{flex:1;border-bottom:1px solid #000;min-height:15px;font-weight:400;padding-left:4px}
.ln span.f{flex:none;width:80px}
.cb{display:inline-block;flex:none;width:12px;height:12px;border:1px solid #000;margin:0 2px 0 8px;font:700 10px/10px Arial,sans-serif;font-style:normal;text-align:center;vertical-align:middle}
#sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
#sheet td,#sheet th{border:1px solid #000;padding:2px 5px;height:31px;font-size:11px;word-break:break-word}
#sheet th{background:#2b2b2b;color:#fff;height:34px;font-size:11.5px}#sheet th{color:#fff}
#sheet td.t{font-weight:700;font-size:10px;text-align:center}
#sheet td.oh{height:20px;font-weight:700;font-size:11px}
.sg{display:flex;justify-content:space-between;margin-top:28px;text-align:center;font-weight:700;font-style:italic}
.sg div{width:42%;border-top:1px solid #000;padding-top:3px}
.rm{min-height:63px;line-height:21px;white-space:pre-wrap;margin-top:8px;background:repeating-linear-gradient(to bottom,transparent 0 20px,#000 20px 21px)}
.rl{display:inline-block;height:21px;margin-right:6px;background:#fff;font-weight:700;vertical-align:top;white-space:nowrap}
@media print{
 @page{size:letter;margin:.4in}
 body{background:#fff}header,main,.tb{display:none!important}
 #view{position:static;display:block!important;background:none;padding:0;overflow:visible}
 #sheet{width:100%;padding:0}
}
</style>
<style>
:root{--r:8px;--rl:14px}
body{font-family:'Inter','Open Sans',Arial,sans-serif}
header{position:sticky;top:0;background:var(--bg);z-index:5}
h1{display:flex;align-items:center;gap:10px}
button{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r);border-color:var(--line);font-weight:500;transition:background .15s,opacity .15s}
button.p{border-color:var(--inv)}button.s{padding:6px 8px}
input,textarea{border-radius:var(--r)}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:relative;max-width:360px;width:100%}.sr .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.sr input{padding-left:36px;max-width:none}
#tbl{border:1px solid var(--line);border-radius:var(--rl);overflow:hidden}
table.l th{background:var(--card)}table.l tr:last-child td{border-bottom:0}table.l tr:hover td{background:var(--card)}
#form{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 14px}
#form[hidden]{display:none}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:var(--rl);width:100%;max-width:860px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dh h2{margin:0;font-size:16px}
fieldset{border-radius:var(--rl)}
#view{z-index:20}.tb button{border-radius:var(--r)}
input:not([type=date]):not([type=checkbox]):not([type=radio]),textarea{text-transform:uppercase}
#sheet td:not(.t),.ln span,.rm{text-transform:uppercase}
@media print{#form{display:none!important}}
</style>
<style>
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--inv);color:var(--invfg);padding:7px 14px;border-radius:99px;z-index:30;margin:0;font-size:13px;max-width:90vw}
#msg:empty{display:none}
#sheet{margin:0;transform-origin:top left}
#sw{margin:0 auto}
@media print{#sw{width:auto!important;height:auto!important}#sheet{transform:none!important}}
@media(max-width:700px){
 body{font-size:16px}table.l td[data-l]::before{font-size:13px}.eq td[data-l]::before{font-size:12px}
 .tb{position:sticky;left:0;width:100vw;z-index:3}.tb button[aria-label^=Zoom]{flex:none;padding:10px 12px}
 header{padding:10px 14px}h1{font-size:15px}.lbl{display:none}
 main{padding:14px}.bar .sr{max-width:none}
 input,textarea{font-size:16px}
 /* list rows become cards */
 table.l,table.l tbody,table.l tr,table.l td{display:block}
 table.l tr.h{display:none}
 table.l tr{padding:12px 14px;border-bottom:1px solid var(--line)}
 table.l td{border:0;padding:2px 0}
 table.l td:first-child{font-weight:600;font-size:15px}
 table.l td[data-l]::before{content:attr(data-l);display:inline-block;min-width:72px;font-size:12px;color:var(--mut)}
 table.l td:first-child::before{display:none}
 td.a{text-align:left;margin-top:8px}td.a button{margin:0 6px 0 0;padding:9px 12px}
 /* form popup becomes full screen */
 #form{padding:0}
 .dlg{border-radius:0;border:0;min-height:100%;max-width:none;padding:0 14px 0}
 .dh{position:sticky;top:0;background:var(--bg);z-index:2;margin:0 -14px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
 .g{grid-template-columns:1fr}
 .acts{position:sticky;bottom:0;background:var(--bg);margin:0 -14px;padding:12px 14px;border-top:1px solid var(--line)}
 .acts button{flex:1;justify-content:center;padding:11px}
 /* equipment rows become stacked cards */
 .eq,.eq tbody,.eq tr,.eq td{display:block;width:auto}
 .eq tr:first-child{display:none}
 .eq tr{padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
 .eq td{padding:3px 0}.eq td:first-child{width:auto}
 .eq td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
 .row{gap:12px}.row label{padding:4px 0}
 .row input[type=checkbox],.row input[type=radio]{width:20px;height:20px}
 #view{padding:8px 0}.tb{flex-wrap:wrap;padding:0 8px}.tb button{flex:1;justify-content:center;padding:10px}
}
</style>
</head>
<body>
<header>
  <h1><span data-i="monitor"></span>IT Equipment Inventory</h1>
  <div class="row"><span id="msg"></span><button onclick="theme()" id="tt">Dark mode</button><button class="p" data-i="plus" onclick="openForm()"><span>New<span class="lbl"> record</span></span></button></div>
</header>
<main>
 <section id="list">
  <div class="bar"><div class="sr"><span data-i="search"></span><input id="q" placeholder="Search end user, division, or serial number" oninput="draw()"></div></div>
  <div id="tbl"></div>
 </section>
 <section id="form" hidden><div class="dlg">
  <div class="dh"><h2 id="ft">New record</h2><button class="s" data-i="x" aria-label="Close" onclick="show('list')"></button></div>
  <div class="g">
   <div><label>End user</label><input data-n="endUser"></div>
   <div><label>Division / Section / Unit</label><input data-n="division"></div>
   <div><label>Year</label><input data-n="year"></div>
   <div><label>Date</label><input type="date" data-n="date"></div>
   <div><label>RAM</label><input data-n="ram"></div>
   <div><label>OS version</label><input data-n="os"></div>
  </div>
  <fieldset><legend>Type of equipment</legend><div class="row">
   <label><input type="radio" name="ty" value="Desktop" data-n="type">Desktop</label>
   <label><input type="radio" name="ty" value="Laptop" data-n="type">Laptop</label></div></fieldset>
  <fieldset><legend>Equipment</legend><div style="overflow-x:auto"><table class="eq" id="main"></table></div></fieldset>
  <fieldset><legend>Other equipments</legend><div style="overflow-x:auto"><table class="eq" id="oth"></table></div></fieldset>
  <fieldset><legend>Software and usage</legend>
   <div class="g"><div><label>Other software installed</label><input data-n="software"></div></div>
   <div class="row" style="margin-bottom:12px"><span>PC usage</span>
    <label><input type="checkbox" data-n="oracle">Oracle</label>
    <label><input type="checkbox" data-n="msoffice">MS Office</label>
    <label style="display:flex;align-items:center;gap:6px">Others <input data-n="othersTxt" style="width:200px"></label></div>
   <label>Remarks / recommendations</label><textarea rows="3" data-n="remarks"></textarea></fieldset>
  <div class="acts"><button data-i="x" onclick="show('list')">Cancel</button><button class="p" data-i="save" onclick="save()">Save record</button></div>
 </div></section>
</main>
<div id="view"><div class="tb">
 <button data-i="zout" aria-label="Zoom out" onclick="zoom(-.15)"></button><button data-i="zin" aria-label="Zoom in" onclick="zoom(.15)"></button><button class="p" data-i="printer" onclick="window.print()">Print</button><button data-i="download" onclick="pdf()">Download PDF</button><button data-i="x" onclick="$('#view').style.display='none'">Close</button></div>
 <div id="sw"><div id="sheet"></div></div></div>

 const q=$('#q').value.toLowerCase();
 const rows=DATA.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
 $('#tbl').innerHTML=rows.length?`<table class="l"><tr class="h"><th>End user</th><th>Division / Section / Unit</th><th>Type</th><th>Date</th><th></th></tr>`+
  rows.map(r=>`<tr><td>${E(r.endUser)}</td><td data-l="Division">${E(r.division)}</td><td data-l="Type">${E(r.type)}</td><td data-l="Date">${E(r.date)}</td><td class="a">
  <button class="s" title="View / print" aria-label="View" onclick="view('${r.id}')">${ic('eye')}</button><button class="s" title="Edit" aria-label="Edit" onclick="openForm('${r.id}')">${ic('pencil')}</button>
  <button class="s" title="Delete" aria-label="Delete" onclick="del('${r.id}',this)">${ic('trash')}</button></td></tr>`).join('')+'</table>'
  :`<div class="empty">${DATA.length?'No records match your search.':'No records yet. Select “New record” to add the first one.'}</div>`}
async function del(id,b){
 if(ASK!==id){ASK=id;b.textContent='Confirm?';setTimeout(()=>{ASK=null;if(b.isConnected)b.innerHTML=ic('trash')},3000);return}
 msg('Deleting…');DATA=await run('deleteRecord',id);ASK=null;msg('Deleted');draw()}

/* form */
const FL={d:'Item / description',s:'Serial number',p:'Property number',m:'MR',t:'Type'};
const inp=(n,ph)=>`<td data-l="${FL[n.slice(-1)]}"><input data-n="${n}" aria-label="${ph}"></td>`;
function openForm(id){
 CUR=id?DATA.find(r=>r.id===id):null;const r=CUR||blank();
 $('#main').innerHTML='<tr><th></th><th>Item / description</th><th>Serial number</th><th>Property number</th><th>MR</th></tr>'+
  MAIN.map(([k,l])=>`<tr><td>${l}</td>${['d','s','p','m'].map(f=>inp(`i.${k}.${f}`,l+' '+f)).join('')}</tr>`).join('');
 $('#oth').innerHTML='<tr><th>Type</th><th>Item / description</th><th>Serial number</th><th>Property number</th><th>MR</th></tr>'+
  r.others.concat(Array(7)).slice(0,7).map((_,i)=>`<tr>${['t','d','s','p','m'].map(f=>inp(`o.${i}.${f}`,'Other '+(i+1)+' '+f)).join('')}</tr>`).join('');
 document.querySelectorAll('[data-n]').forEach(el=>{const v=get(r,el.dataset.n);
  if(el.type==='checkbox')el.checked=!!v;else if(el.type==='radio')el.checked=v===el.value;else el.value=v??''});
 $('#ft').textContent=id?'Edit record':'New record';show('form');$('#form').scrollTop=0}
function get(r,n){const p=n.split('.');return p[0]==='i'?r.items[p[1]]?.[p[2]]:p[0]==='o'?r.others[p[1]]?.[p[2]]:r[p[0]]}
function collect(){const r=blank();r.id=CUR?.id||'';
 document.querySelectorAll('[data-n]').forEach(el=>{
  const v=el.type==='checkbox'?el.checked:el.type==='radio'?(el.checked?el.value:undefined):el.type==='date'?el.value:el.value.toUpperCase();if(v===undefined)return;
  const p=el.dataset.n.split('.');
  if(p[0]==='i')(r.items[p[1]]??={})[p[2]]=v;else if(p[0]==='o')r.others[p[1]][p[2]]=v;else r[p[0]]=v});
 return r}
async function save(){
 const r=collect();if(!r.endUser.trim()){msg('Enter the end user’s name.');return}
 msg('Saving…');try{DATA=await run('saveRecord',r);msg('Saved');show('list');draw()}catch(e){msg('Error: '+e.message)}}

/* printable form (mirrors the paper layout) */
const cb=on=>`<i class="cb">${on?'✕':''}</i>`;
function sheet(r){
 const mr=MAIN.map(([k,l])=>{const i=r.items[k]||{};return `<tr><td class="t">${l}</td><td>${E(i.d)}</td><td>${E(i.s)}</td><td>${E(i.p)}</td><td>${E(i.m)}</td></tr>`}).join('');
 const ot=Array.from({length:7},(_,n)=>{const i=r.others[n]||{};return `<tr><td class="t">${E(i.t)}</td><td>${E(i.d)}</td><td>${E(i.s)}</td><td>${E(i.p)}</td><td>${E(i.m)}</td></tr>`}).join('');
 const cg='<colgroup><col width="11%"><col width="39%"><col width="18%"><col width="17%"><col width="15%"></colgroup>';
 return `<div class="hd"><div class="ttl">TECHNICAL SERVICE DIVISION<br>INFORMATION TECHNOLOGY UNIT</div>
 <div class="logos"><img src="${BP}" alt="Bagong Pilipinas"><img src="${PPA}" alt="Philippine Ports Authority"></div></div>
 <div class="sub"><div class="l">ANNUAL PHYSICAL INVENTORY OF COMPUTERS AND OTHER IT EQUIPMENT<small>for the year of <u>${E(r.year)}</u></small></div>
 <div class="r">Doc. Ref. Code: NCN-RMD-034<br>Date Regd.: January 15, 2026</div></div>
 <div class="bx"><div class="ln">End User<span>${E(r.endUser)}</span></div><div class="ln">Division/Section/Unit<span>${E(r.division)}</span></div>
 <div class="ln">Type of Equipment ${cb(r.type==='Desktop')}<b style="font-weight:400;font-size:10px">DESKTOP</b>${cb(r.type==='Laptop')}<b style="font-weight:400;font-size:10px">LAPTOP</b>
 &nbsp;&nbsp;RAM<span class="f">${E(r.ram)}</span>&nbsp;OS Version<span class="f" style="width:100px">${E(r.os)}</span>&nbsp;Date<span class="f" style="width:90px">${E(r.date)}</span></div></div>
 <table style="margin-top:10px">${cg}<tr><th>Type</th><th>Item/Description</th><th>Serial Number</th><th>Property Number</th><th>MR</th></tr>${mr}
 <tr><td class="oh" colspan="5">Other Equipments:</td></tr>${ot}</table>
 <div class="bx" style="margin-top:10px"><div class="ln">Other Software Installed<span>${E(r.software)}</span></div>
 <div class="ln">PC Usage ${cb(r.oracle)}<b style="font-weight:400;font-size:10px">Oracle</b>${cb(r.msoffice)}<b style="font-weight:400;font-size:10px">MS Office</b>
 ${cb(!!r.othersTxt)}<b style="font-weight:400;font-size:10px">Others:</b><span>${E(r.othersTxt)}</span></div>
 <div class="rm"><span class="rl">Remarks/Recommendations</span>${E(r.remarks)}</div>
 <div class="sg"><div>END-USER</div><div>IT INSPECTOR</div></div></div>`}
let Z=null,CS=1;
const fitS=()=>Math.min(1,(innerWidth-16)/740);
function fit(){const f=fitS(),sh=$('#sheet');
 let s=Z??(innerWidth<700?Math.max(f,.75):f);s=Math.min(1.6,Math.max(f,s));CS=s;
 sh.style.transform=s!==1?`scale(${s})`:'';
 $('#sw').style.width=740*s+'px';$('#sw').style.height=sh.offsetHeight*s+'px'}
function zoom(d){Z=CS+d;fit()}
function view(id){$('#sheet').innerHTML=sheet(DATA.find(r=>r.id===id));$('#view').style.display='block';$('#view').scrollTop=0;Z=null;fit()}
addEventListener('resize',()=>{if($('#view').style.display==='block')fit()});
async function pdf(){
 msg('Preparing PDF…');const el=$('#sheet'),t=el.style.transform;el.style.transform='';$('#view').scrollTop=0;
 const c=await html2canvas(el,{scale:2,backgroundColor:'#fff',scrollX:0,scrollY:0,windowWidth:1000});el.style.transform=t;
 const d=new jspdf.jsPDF({unit:'in',format:'letter'});const w=7.7;
 d.addImage(c.toDataURL('image/jpeg',.95),'JPEG',.4,.4,w,Math.min(w*c.height/c.width,10.2));
 d.save('IT-Inventory-'+(el.querySelector('.ln span')?.textContent||'form').replace(/\W+/g,'_')+'.pdf');msg('')}
document.addEventListener('input',e=>{const el=e.target;
 if(el.closest('#form')&&(el.tagName==='TEXTAREA'||el.type==='text')){const s=el.selectionStart,t=el.selectionEnd;el.value=el.value.toUpperCase();el.setSelectionRange(s,t)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')show('list')});
document.querySelectorAll('[data-i]').forEach(b=>b.insertAdjacentHTML('afterbegin',ic(b.dataset.i)));
load();
</script>
</body>
</html>
